[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termwrapped"
dynamic = ["version"]
description = "Spotify Wrapped for your Linux terminal. Local-only, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["linux", "terminal", "wrapped", "year-in-review", "cli", "bash", "zsh", "fish"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ethembeldagli/termwrapped"

[project.scripts]
termwrapped = "termwrapped.cli:main"

[tool.setuptools]
packages = ["termwrapped"]

[tool.setuptools.dynamic]
version = { attr = "termwrapped.__version__" }
