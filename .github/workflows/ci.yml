name: CI

on:
  push:
  pull_request:

jobs:
  distros:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            setup: apt-get update -q && apt-get install -yq python3 git
          - name: Debian 12
            image: debian:12
            setup: apt-get update -q && apt-get install -yq python3 git
          - name: Fedora
            image: fedora:latest
            setup: dnf install -yq python3 git
          - name: Arch Linux
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed python git
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            setup: zypper -n install python3 git
          - name: Alpine (musl)
            image: alpine:latest
            setup: apk add --no-cache python3 git
          - name: Python 3.9 (oldest supported)
            image: python:3.9-slim
            setup: apt-get update -q && apt-get install -yq git
    steps:
      - name: Install Python and git
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Build single-file release
        run: sh build.sh
      - name: Run the release on a demo home
        run: |
          python3 tests/fixtures.py /tmp/demo
          HOME=/tmp/demo python3 dist/termwrapped.pyz --year 2025 --plain --card /tmp/card.svg
          test -s /tmp/card.svg
      - name: install.sh from this checkout, then uninstall
        run: |
          sh install.sh --from . --bin-dir /tmp/twbin
          /tmp/twbin/termwrapped --version
          sh install.sh --from . --bin-dir /tmp/twbin --check | grep "Up to date"
          sh install.sh --from . --bin-dir /tmp/twbin --update | grep "Already up to date"
          sh install.sh --uninstall --bin-dir /tmp/twbin
          test ! -e /tmp/twbin/termwrapped
      - name: install.sh from GitHub, like curl | sh
        if: github.ref == 'refs/heads/main'
        run: |
          if command -v curl >/dev/null || command -v wget >/dev/null; then
            cat install.sh | sh
            termwrapped --version
            sh install.sh --check
          else
            echo "This image has no curl or wget: check we explain that clearly."
            ! sh install.sh 2>/tmp/err.txt
            grep "curl nor wget" /tmp/err.txt
          fi
